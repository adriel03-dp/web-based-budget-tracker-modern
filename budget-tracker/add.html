<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction | Modern Budget Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="nav-link"><i class="fas fa-chart-bar"></i> Dashboard</a>
        <a href="add.html" class="nav-link active"><i class="fas fa-plus"></i> Add Transaction</a>
        <a href="history.html" class="nav-link"><i class="fas fa-list"></i> History</a>
    </nav>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-dollar-sign"></i>
            </div>
            <h1>Add Transaction</h1>
            <p class="subtitle">Add your income or expense below</p>
        </div>
        <div class="form-section">
            <div class="form-toggle-buttons">
                <button id="income-btn" class="add-btn income-toggle" type="button">
                    <i class="fas fa-plus"></i> Add Income
                </button>
                <button id="expense-btn" class="add-btn expense-toggle" type="button">
                    <i class="fas fa-minus"></i> Add Expense
                </button>
            </div>
            <form id="income-form" class="transaction-form" style="display:none;">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="income-text">Description</label>
                        <input type="text" id="income-text" placeholder="Enter income description" required>
                    </div>
                    <div class="form-group">
                        <label for="income-amount">Amount</label>
                        <input type="number" id="income-amount" step="0.01" min="0.01" placeholder="Enter amount (positive)" required>
                    </div>
                </div>
                <button type="submit" class="add-btn income-btn">
                    <i class="fas fa-plus"></i> Add Income
                </button>
            </form>
            <form id="expense-form" class="transaction-form" style="display:none;">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="expense-text">Description</label>
                        <input type="text" id="expense-text" placeholder="Enter expense description" required>
                    </div>
                    <div class="form-group">
                        <label for="expense-amount">Amount</label>
                        <input type="number" id="expense-amount" step="0.01" min="0.01" placeholder="Enter amount (positive)" required>
                    </div>
                </div>
                <button type="submit" class="add-btn expense-btn">
                    <i class="fas fa-minus"></i> Add Expense
                </button>
            </form>
        </div>
    </div>
    <script src="add.js"></script>
</body>
</html>
