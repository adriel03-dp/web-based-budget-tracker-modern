<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Modern Budget Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="nav-link active"><i class="fas fa-chart-bar"></i> Dashboard</a>
        <a href="add.html" class="nav-link"><i class="fas fa-plus"></i> Add Transaction</a>
        <a href="history.html" class="nav-link"><i class="fas fa-list"></i> History</a>
    </nav>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-dollar-sign"></i>
            </div>
            <h1>Budget Tracker</h1>
            <p class="subtitle">Take control of your finances with modern tracking</p>
        </div>
        <div class="dashboard">
            <div class="dashboard-card balance-card">
                <div class="card-header">
                    <h4>Total Balance</h4>
                    <i class="fas fa-wallet"></i>
                </div>
                <div id="dashboard-balance" class="card-value">$0.00</div>
            </div>
            <div class="dashboard-card income-card">
                <div class="card-header">
                    <h4>Total Income</h4>
                    <i class="fas fa-trending-up"></i>
                </div>
                <div id="dashboard-income" class="card-value">$0.00</div>
            </div>
            <div class="dashboard-card expense-card">
                <div class="card-header">
                    <h4>Total Expense</h4>
                    <i class="fas fa-trending-down"></i>
                </div>
                <div id="dashboard-expense" class="card-value">$0.00</div>
            </div>
            <div class="dashboard-card transactions-card">
                <div class="card-header">
                    <h4>Transactions</h4>
                    <i class="fas fa-receipt"></i>
                </div>
                <div id="dashboard-count" class="card-value">0</div>
            </div>
        </div>
        <div class="charts-grid">
            <div class="chart-section">
                <h3><i class="fas fa-chart-bar"></i> Recent Transactions</h3>
                <canvas id="barChart" height="120"></canvas>
            </div>
            <div class="summary-section">
                <h3>Income vs Expenses</h3>
                <div class="summary-cards">
                    <div class="summary-card income-summary">
                        <div class="summary-header">
                            <h4>Income</h4>
                            <i class="fas fa-trending-up"></i>
                        </div>
                        <p id="income-summary" class="summary-amount">$0.00</p>
                    </div>
                    <div class="summary-card expense-summary">
                        <div class="summary-header">
                            <h4>Expense</h4>
                            <i class="fas fa-trending-down"></i>
                        </div>
                        <p id="expense-summary" class="summary-amount">$0.00</p>
                    </div>
                </div>
                <div class="net-balance">
                    <p class="balance-label">Net Balance</p>
                    <p id="net-balance" class="balance-value">$0.00</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
