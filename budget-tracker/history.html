<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | Modern Budget Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="nav-link"><i class="fas fa-chart-bar"></i> Dashboard</a>
        <a href="add.html" class="nav-link"><i class="fas fa-plus"></i> Add Transaction</a>
        <a href="history.html" class="nav-link active"><i class="fas fa-list"></i> History</a>
    </nav>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-dollar-sign"></i>
            </div>
            <h1>Transaction History</h1>
            <p class="subtitle">View and manage all your transactions</p>
        </div>
        <div class="history-section">
            <h3>History</h3>
            <div class="empty-state" id="empty-state">
                <i class="fas fa-receipt"></i>
                <p>No transactions yet. Add your first transaction!</p>
            </div>
            <ul id="list" class="transactions-list"></ul>
        </div>
    </div>
    <script src="history.js"></script>
</body>
</html>
